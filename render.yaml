services:
  - type: web
    name: narratiaa-web
    runtime: docker
    dockerfilePath: ./infrastructure/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: COOKIE_SECURE
        value: true
      - key: DB_HOST
        fromDatabase:
          name: narratiaa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: narratiaa-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: narratiaa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: narratiaa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: narratiaa-db
          property: password
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Narratiaa

databases:
  - name: narratiaa-db
    region: frankfurt
    plan: free
    databaseName: narratiaa
    user: narratiaa
    ipAllowList: []
