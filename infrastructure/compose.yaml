services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: narratiaa
      POSTGRES_USER: narratiaa
      POSTGRES_PASSWORD: narratiaa
    ports:
      - "5434:5432"
    volumes:
      - narratiaa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narratiaa -d narratiaa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  narratiaa-postgres:
