server:
  port: ${PORT:3107}
  forward-headers-strategy: framework
  error:
    include-message: never
spring:
  application:
    name: narratiaa-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:narratiaa}
    username: ${DB_USERNAME:narratiaa}
    password: ${DB_PASSWORD:narratiaa}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
narratiaa:
  cookie-secure: ${COOKIE_SECURE:false}
  resend-api-key: ${RESEND_API_KEY:}
  email-from: ${EMAIL_FROM:Narratiaa <onboarding@resend.dev>}
