server:
  port: ${PORT:3107}
  forward-headers-strategy: framework
  error:
    include-message: never
spring:
  application:
    name: narratiaa-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:narratiaa}
    username: ${DB_USERNAME:narratiaa}
    password: ${DB_PASSWORD:narratiaa}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
management:
  endpoints:
    web:
      exposure:
        include: health,info
narratiaa:
  cookie-secure: ${COOKIE_SECURE:false}
  email-from: ${EMAIL_FROM:${MAIL_USERNAME:}}
